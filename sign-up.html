<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anima Project - Sign Up</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lalezar:400");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="./sign-up.css" />
  </head>
  <body>
    <div class="sign-up" data-model-id="7:16">
      <a class="text-wrapper" href="./sign-in.html">Already have an account? Log In</a>
      <div class="group">
        <img
          class="vector"
          alt="Vector"
          src="https://c.animaapp.com/wj95Il4b/img/vector.svg"
        />
        <img
          class="img"
          alt="Vector"
          src="https://c.animaapp.com/wj95Il4b/img/vector-1.svg"
        />
        <div class="div">Log in</div>
        <button class="log-in-click-area" type="button" aria-label="Create account"></button>
        <div class="text-wrapper-2">Confirm Password</div>
        <img
          class="vector-2"
          alt="Vector"
          src="https://c.animaapp.com/wj95Il4b/img/vector-3.svg"
        />
        <input class="sign-up-input confirm-password-input" type="password" aria-label="Confirm Password" />
        <div class="rectangle"></div>
        <input class="sign-up-input password-input" type="password" aria-label="Password" />
        <div class="text-wrapper-3"></div>
        <div class="text-wrapper-4">Password</div>
        <div class="text-wrapper-5">Email</div>
        <img
          class="vector-3"
          alt="Vector"
          src="https://c.animaapp.com/wj95Il4b/img/vector-3.svg"
        />
        <input class="sign-up-input email-input" type="email" aria-label="Email" />
        <img
          class="vector-4"
          alt="Vector"
          src="https://c.animaapp.com/wj95Il4b/img/vector-4.svg"
        />
        <input class="sign-up-input full-name-input" type="text" aria-label="Full Name" />
        <div class="text-wrapper-6">Full Name</div>
      </div>
      <div class="text-wrapper-7"></div>
      <div class="text-wrapper-8">CREATE AN ACCOUNT</div>
      <div class="group-2">
        <img
          class="image"
          alt="Image"
          src="https://c.animaapp.com/wj95Il4b/img/image.png"
        />
        <img
          class="image-2"
          alt="Image"
          src="https://c.animaapp.com/wj95Il4b/img/image-1.png"
        />
      </div>
    </div>
    <script src="./sign-up.js"></script>
  </body>
</html>
