<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anima Project - Sign In</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lalezar:400");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="./sign-in.css" />
  </head>
  <body>
    <div class="sign-in" data-model-id="4:26">
      <div class="group">
        <img
          class="vector"
          alt="Vector"
          src="https://c.animaapp.com/7AP9rKTx/img/vector.svg"
        />
        <img
          class="img"
          alt="Vector"
          src="https://c.animaapp.com/7AP9rKTx/img/vector-1.svg"
        />
        <div class="text-wrapper">Sign in</div>
        <button class="sign-in-click-area" type="button" aria-label="Sign in"></button>
        <a class="don-t-have-an" href="./sign-up.html">Don't have an account? Sign Up</a>
        <div class="rectangle"></div>
        <input class="password-input" type="password" aria-label="Password" />
        <div class="div">Password</div>
        <img
          class="vector-2"
          alt="Vector"
          src="https://c.animaapp.com/7AP9rKTx/img/vector-2.svg"
        />
        <input class="email-input" type="email" aria-label="Email" />
        <div class="text-wrapper-2">Email</div>
      </div>
      <p class="p">SIGN IN TO YOUR ACCOUNT</p>
      <div class="group-2">
        <img
          class="image"
          alt="Image"
          src="https://c.animaapp.com/7AP9rKTx/img/image.png"
        />
        <img
          class="image-2"
          alt="Image"
          src="https://c.animaapp.com/7AP9rKTx/img/image-1.png"
        />
      </div>
    </div>
    <script src="./sign-in.js"></script>
  </body>
</html>
