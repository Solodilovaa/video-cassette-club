<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anima Project - Landing</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lalezar:400");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="landing" data-model-id="1:2">
      <a class="group" href="./sign-in.html" aria-label="Pick your movie">
        <img
          class="vector"
          alt="Vector"
          src="https://c.animaapp.com/R2iVco8p/img/vector.svg"
        />
        <div class="text-wrapper">PICK YOUR MOVIE</div>
      </a>
      <img
        class="image"
        alt="Image"
        src="https://c.animaapp.com/R2iVco8p/img/image.png"
      />
      <p class="VIDEO-CASSETTE-CLUB">
        <span class="span">VIDEO </span>
        <span class="text-wrapper-2">CASSETTE</span>
        <span class="span"> CLUB</span>
      </p>
    </div>
  </body>
</html>
