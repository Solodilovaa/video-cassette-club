<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anima Project - Admin Account</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lalezar:400");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="./admin-account.css" />
  </head>
  <body>
    <div class="admin-account" data-model-id="87:50">
      <img
        class="image"
        alt="Image"
        src="https://c.animaapp.com/k1SN887P/img/image.png"
      />
      <div class="group">
        <div class="rectangle"></div>
        <a class="div logout-link" href="./sign-in.html" aria-label="Log out">
          <div class="rectangle-2"></div>
          <div class="text-wrapper">LOG OUT</div>
        </a>
        <button class="update-info-button" type="button">
          <span class="rectangle-3"></span>
          <span class="text-wrapper-2">UPDATE INFO</span>
        </button>
        <div class="text-wrapper-3">Email</div>
        <div class="text-wrapper-4" id="admin-account-email">jd@example.com</div>
        <div class="text-wrapper-5">Admin</div>
        <div class="text-wrapper-6">Access Level:</div>
        <img
          class="line"
          alt="Line"
          src="https://c.animaapp.com/k1SN887P/img/line.svg"
        />
        <div class="text-wrapper-7">John Due</div>
        <div class="text-wrapper-8">Member Profile</div>
        <div class="group-2">
          <div class="ellipse"></div>
          <div class="text-wrapper-9">JD</div>
        </div>
      </div>
      <div class="text-wrapper-10">YOUR ACCOUNT</div>
      <p class="VIDEO-CASSETTE-CLUB">
        <span class="span">VIDEO </span>
        <span class="text-wrapper-11">CASSETTE</span>
        <span class="span"> CLUB</span>
      </p>
      <a class="USER-RENTALS" href="./admin-rentals.html">USER&amp;RENTALS</a>
      <a class="account-circle account-circle-instance" href="./admin-account.html" aria-label="Admin account">
        <img
          alt="Account circle"
          src="https://c.animaapp.com/k1SN887P/img/account-circle-1.svg"
        />
      </a>
      <a class="text-wrapper-12" href="./admin-tapes.html">TAPES MANAGEMENT</a>
      <div class="admin-profile-overlay" aria-hidden="true">
        <div class="admin-member-profile" role="dialog" aria-modal="true" aria-labelledby="admin-profile-title" data-model-id="89:147">
          <div class="admin-profile-group">
            <img
              class="admin-edit admin-edit-2"
              alt="Edit"
              src="https://c.animaapp.com/mFxIxYz6/img/edit-2.svg"
            />
            <div class="admin-profile-access-value">Admin</div>
            <div class="admin-profile-email-label">Email</div>
            <div class="admin-profile-name">John Due</div>
            <div class="admin-profile-title" id="admin-profile-title">Member Profile</div>
            <div class="admin-profile-ellipse"></div>
            <div class="admin-profile-initials">JD</div>
            <img
              class="admin-profile-line"
              alt="Line"
              src="https://c.animaapp.com/mFxIxYz6/img/line.svg"
            />
            <div class="admin-profile-access-label">Access Level:</div>
            <input class="admin-profile-email-input" type="email" value="jd@example.com" aria-label="Email" />
            <button class="admin-profile-update-button" type="button">
              <span class="admin-profile-update-rectangle"></span>
              <span class="admin-profile-update-text">UPDATE</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./admin-account.js"></script>
  </body>
</html>
