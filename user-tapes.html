<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anima Project - User Tapes</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lalezar:400");
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="./user-tapes.css" />
  </head>
  <body>
    <div class="user-tapes" data-model-id="19:28">
      <div class="frame">
        <div class="group tape-card" data-title="THE TERMINATOR">
          <img
            class="vector"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-5.svg"
          />
          <img
            class="image"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image@2x.png"
          />
          <div class="text-wrapper">THE TERMINATOR</div>
        </div>
        <a class="div tape-card" href="./user-movie.html" aria-label="Open Home Alone" data-title="HOME ALONE">
          <img
            class="img"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-1.svg"
          />
          <img
            class="image-2"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image-1@2x.png"
          />
          <div class="text-wrapper-2">HOME ALONE</div>
        </a>
        <div class="group tape-card" data-title="PULP FICTION">
          <img
            class="vector"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-5.svg"
          />
          <div class="text-wrapper-3">PULP FICTION</div>
          <img
            class="image-3"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image-2@2x.png"
          />
        </div>
        <div class="group tape-card" data-title="FIGHT CLUB">
          <img
            class="vector"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-5.svg"
          />
          <img
            class="image"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image-3@2x.png"
          />
          <div class="text-wrapper-4">FIGHT CLUB</div>
        </div>
        <div class="group tape-card" data-title="TITANIK">
          <img
            class="vector"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-4.svg"
          />
          <div class="text-wrapper-5">TITANIK</div>
          <img
            class="image-4"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image-4@2x.png"
          />
        </div>
        <div class="group-2 tape-card" data-title="BACK TO THE FUTURE">
          <img
            class="vector"
            alt="Vector"
            src="https://c.animaapp.com/obem5pf0/img/vector-5.svg"
          />
          <div class="text-wrapper-6">BACK TO THE FUTURE</div>
          <img
            class="image-5"
            alt="Image"
            src="https://c.animaapp.com/obem5pf0/img/image-5@2x.png"
          />
        </div>
      </div>
      <p class="p">
        Browse our full catalog of legendary VHS blockbusters available today.
      </p>
      <div class="CHOOSE-YOUR-TAPE">
        CHOOSE <br />
        YOUR TAPE
      </div>
      <p class="VIDEO-CASSETTE-CLUB">
        <span class="span">VIDEO </span>
        <span class="text-wrapper-7">CASSETTE</span>
        <span class="span"> CLUB</span>
      </p>
      <div class="text-wrapper-8">ALL TAPES</div>
      <div class="search-rectangle"></div>
      <input class="movie-search-input" type="search" aria-label="Search movie by title" />
      <img
        class="search search-instance"
        alt="Search"
        src="https://c.animaapp.com/FTUjSHOG/img/search-1.svg"
      />
      <a class="account-circle account-circle-instance" href="./user-account.html" aria-label="Open account">
        <img
          alt="Account circle"
          src="https://c.animaapp.com/obem5pf0/img/account-circle-1.svg"
        />
      </a>
    </div>
    <script src="./user-tapes.js"></script>
  </body>
</html>
